<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Walker Wolfe Developments</title>
<style>
  :root{
    --black:#000000;
    --white:#ffffff;
    --line:#e4e4e4;
    --line-strong:#000000;
    --gray:#9a9a9a;
    --gray-dark:#4d4d4d;
    --hover:#f5f5f5;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    background:var(--white);
    color:var(--black);
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body{min-height:100vh;}
  button{
    font-family:inherit;
    cursor:pointer;
    background:none;
    border:none;
    color:var(--black);
  }
  input, textarea{
    font-family:inherit;
    color:var(--black);
    border:1px solid var(--line);
    background:var(--white);
  }
  input:focus, textarea:focus, button:focus-visible{
    outline:2px solid var(--black);
    outline-offset:1px;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px 32px;
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    background:var(--white);
    z-index:20;
  }
  .brand{
    font-size:15px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand .dot{width:7px;height:7px;background:var(--black);border-radius:50%;display:inline-block;}
  .topbar-actions{display:flex;gap:14px;align-items:center;}
  .save-indicator{
    font-size:11px;
    color:var(--gray);
    letter-spacing:0.03em;
    min-width:70px;
    text-align:right;
  }
  .btn{
    font-size:13px;
    letter-spacing:0.02em;
    padding:9px 16px;
    border:1px solid var(--black);
    background:var(--black);
    color:var(--white);
    transition:opacity .15s ease;
  }
  .btn:hover{opacity:0.75;}
  .btn-outline{
    background:var(--white);
    color:var(--black);
    border:1px solid var(--line);
  }
  .btn-outline:hover{border-color:var(--black);}
  .btn-text{
    font-size:13px;
    color:var(--gray-dark);
    padding:4px 0;
  }
  .btn-text:hover{color:var(--black);}

  /* ---------- Views ---------- */
  .view{display:none;}
  .view.active{display:block;}
  .container{max-width:1100px;margin:0 auto;padding:40px 32px 100px;}

  /* ---------- Home / Grid ---------- */
  .page-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-bottom:32px;
  }
  .page-title{
    font-size:28px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .page-sub{
    font-size:13px;
    color:var(--gray);
    margin-top:6px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
    gap:22px;
  }
  .tile{
    border:1px solid var(--line);
    background:var(--white);
    text-align:left;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    transition:border-color .15s ease, transform .15s ease;
    position:relative;
  }
  .tile:hover{border-color:var(--black);transform:translateY(-2px);}
  .tile-img{
    width:100%;
    aspect-ratio:1/1;
    background:var(--hover);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border-bottom:1px solid var(--line);
  }
  .tile-img img{width:100%;height:100%;object-fit:cover;display:block;}
  .tile-img .placeholder{font-size:11px;color:var(--gray);letter-spacing:0.05em;text-transform:uppercase;}
  .tile-body{padding:14px 16px 16px;}
  .tile-name{font-size:15px;font-weight:700;margin-bottom:8px;line-height:1.3;}
  .tile-meta{display:flex;justify-content:space-between;align-items:center;}
  .stage-badge{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--gray-dark);
    border:1px solid var(--line);
    padding:3px 8px;
  }
  .progress-track{
    height:2px;
    background:var(--line);
    width:100%;
    margin-top:12px;
  }
  .progress-fill{height:100%;background:var(--black);}

  .add-tile{
    border:1px dashed var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:230px;
    flex-direction:column;
    gap:8px;
    color:var(--gray-dark);
    background:var(--white);
  }
  .add-tile:hover{border-color:var(--black);color:var(--black);}
  .add-tile .plus{font-size:26px;font-weight:300;line-height:1;}
  .add-tile span:last-child{font-size:12px;letter-spacing:0.03em;text-transform:uppercase;}

  .empty-state{
    text-align:center;
    padding:100px 20px;
    color:var(--gray);
  }
  .empty-state h2{font-size:18px;color:var(--black);margin-bottom:8px;}
  .empty-state p{font-size:13px;margin-bottom:20px;}

  /* ---------- Categories ---------- */
  .head-actions{display:flex;gap:10px;align-items:center;}
  .category-section{margin-bottom:44px;}
  .category-section:last-child{margin-bottom:0;}
  .category-header{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:16px;
    padding-bottom:8px;
    border-bottom:1px solid var(--black);
  }
  .category-header h2{
    font-size:13px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.06em;
  }
  .category-header .cat-count{font-size:11px;color:var(--gray);}
  .category-empty-row{
    font-size:12px;
    color:var(--gray);
    border:1px dashed var(--line);
    padding:16px;
  }
  .cat-tag{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--gray);
    margin-bottom:6px;
    display:block;
  }
  .cat-select-row{display:flex;flex-direction:column;gap:8px;}
  .cat-pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .cat-pill{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    padding:6px 12px;
    border:1px solid var(--line);
    color:var(--gray-dark);
  }
  .cat-pill.active{background:var(--black);color:var(--white);border-color:var(--black);}
  .cat-pill:hover:not(.active){border-color:var(--black);color:var(--black);}
  .cat-pill.add-cat-pill{border-style:dashed;}

  .manage-cat-list{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;max-height:240px;overflow-y:auto;}
  .manage-cat-row{display:flex;gap:8px;align-items:center;}
  .manage-cat-row input{flex:1;padding:8px 10px;font-size:13px;}
  .manage-cat-row button{font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:0.03em;flex-shrink:0;}
  .manage-cat-row button:hover{color:var(--black);}
  .manage-cat-add{display:flex;gap:10px;}
  .manage-cat-add input{flex:1;padding:9px 10px;font-size:13px;}

  /* ---------- Detail view ---------- */
  .detail-head{
    display:flex;
    gap:28px;
    align-items:flex-start;
    margin-bottom:44px;
    flex-wrap:wrap;
  }
  .detail-img{
    width:160px;
    height:160px;
    flex-shrink:0;
    background:var(--hover);
    border:1px solid var(--line);
    overflow:hidden;
    position:relative;
    cursor:pointer;
  }
  .detail-img img{width:100%;height:100%;object-fit:cover;display:block;}
  .detail-img .placeholder{
    width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:0.05em;
  }
  .detail-img .img-overlay{
    position:absolute;inset:0;background:rgba(0,0,0,0.55);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:11px;
    letter-spacing:0.05em;text-transform:uppercase;opacity:0;transition:opacity .15s ease;
  }
  .detail-img:hover .img-overlay{opacity:1;}
  .detail-info{flex:1;min-width:220px;}
  .detail-name{
    font-size:26px;
    font-weight:700;
    border:none;
    width:100%;
    margin-bottom:10px;
    letter-spacing:-0.01em;
  }
  .detail-name:focus{outline:none;border-bottom:1px solid var(--black);}
  .stage-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .stage-pill{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    padding:6px 12px;
    border:1px solid var(--line);
    color:var(--gray-dark);
  }
  .stage-pill.active{background:var(--black);color:var(--white);border-color:var(--black);}
  .stage-pill:hover:not(.active){border-color:var(--black);color:var(--black);}
  .detail-actions{display:flex;gap:16px;margin-top:8px;}

  section.block{margin-bottom:52px;}
  .block-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
    border-bottom:1px solid var(--black);
    padding-bottom:10px;
  }
  .block-title{
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.08em;
  }
  .block-count{font-size:11px;color:var(--gray);}

  /* To-do */
  .todo-add{display:flex;gap:10px;margin-bottom:16px;}
  .todo-add input{flex:1;padding:10px 12px;font-size:13px;}
  .todo-list{display:flex;flex-direction:column;}
  .todo-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 2px;
    border-bottom:1px solid var(--line);
  }
  .todo-check{
    width:16px;height:16px;
    border:1px solid var(--black);
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;
  }
  .todo-check.checked{background:var(--black);color:var(--white);}
  .todo-text{flex:1;font-size:14px;}
  .todo-text.done{color:var(--gray);text-decoration:line-through;}
  .todo-del{font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:0.04em;opacity:0;transition:opacity .15s ease;}
  .todo-item:hover .todo-del{opacity:1;}
  .todo-del:hover{color:var(--black);}
  .block-empty{font-size:13px;color:var(--gray);padding:8px 2px;}

  /* Files grid */
  .files-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));
    gap:14px;
  }
  .file-card{
    border:1px solid var(--line);
    aspect-ratio:1/1;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
  }
  .file-thumb{
    flex:1;
    background:var(--hover);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .file-thumb img{width:100%;height:100%;object-fit:cover;}
  .file-thumb .file-icon{font-size:22px;color:var(--gray);}
  .file-name{
    font-size:11px;
    padding:7px 9px;
    border-top:1px solid var(--line);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .file-del{
    position:absolute;top:5px;right:5px;
    width:18px;height:18px;
    background:var(--white);
    border:1px solid var(--line);
    font-size:11px;
    line-height:1;
    display:flex;align-items:center;justify-content:center;
    opacity:0;
    transition:opacity .15s ease;
  }
  .file-card:hover .file-del{opacity:1;}
  .file-del:hover{border-color:var(--black);}
  .add-file-card{
    border:1px dashed var(--line);
    aspect-ratio:1/1;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:6px;
    color:var(--gray-dark);
  }
  .add-file-card:hover{border-color:var(--black);color:var(--black);}
  .add-file-card .plus{font-size:22px;font-weight:300;}
  .add-file-card span:last-child{font-size:10px;text-transform:uppercase;letter-spacing:0.04em;}

  /* Timeline */
  .timeline-wrap{
    position:relative;
    padding:10px 0 4px;
  }
  .timeline{
    display:flex;
    align-items:flex-start;
    overflow-x:auto;
    padding:20px 4px 30px;
    gap:0;
    scrollbar-width:thin;
  }
  .t-node-group{
    display:flex;
    align-items:center;
    flex-shrink:0;
  }
  .t-connector{
    width:52px;
    height:1px;
    background:var(--line);
    flex-shrink:0;
  }
  .t-node{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:170px;
    flex-shrink:0;
    cursor:pointer;
  }
  .t-dot{
    width:13px;height:13px;
    border-radius:50%;
    background:var(--white);
    border:2px solid var(--black);
    flex-shrink:0;
    transition:transform .15s ease;
  }
  .t-node:hover .t-dot{transform:scale(1.25);}
  .t-date{font-size:10px;color:var(--gray);margin-top:10px;text-transform:uppercase;letter-spacing:0.04em;}
  .t-text{
    font-size:12px;
    text-align:center;
    margin-top:4px;
    max-width:160px;
    line-height:1.4;
    word-wrap:break-word;
  }
  .t-add-btn{
    flex-shrink:0;
    width:28px;height:28px;
    border-radius:50%;
    border:1px dashed var(--gray);
    display:flex;align-items:center;justify-content:center;
    font-size:15px;
    color:var(--gray);
    margin:0 6px;
  }
  .t-add-btn:hover{border-color:var(--black);color:var(--black);border-style:solid;}
  .timeline-empty{
    font-size:13px;color:var(--gray);
    display:flex;align-items:center;gap:14px;
    padding:20px 2px;
  }

  /* ---------- Modal ---------- */
  .modal-overlay{
    display:none;
    position:fixed;inset:0;
    background:rgba(0,0,0,0.4);
    z-index:100;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .modal-overlay.active{display:flex;}
  .modal{
    background:var(--white);
    border:1px solid var(--black);
    width:100%;
    max-width:420px;
    padding:28px;
  }
  .modal h3{font-size:15px;font-weight:700;margin-bottom:20px;text-transform:uppercase;letter-spacing:0.04em;}
  .modal label{
    display:block;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--gray-dark);
    margin-bottom:6px;
    margin-top:16px;
  }
  .modal label:first-of-type{margin-top:0;}
  .modal input[type=text], .modal input[type=date], .modal textarea{
    width:100%;
    padding:10px 12px;
    font-size:13px;
  }
  .modal textarea{resize:vertical;min-height:70px;}
  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:12px;
    margin-top:26px;
  }
  .file-input-row{
    border:1px dashed var(--line);
    padding:16px;
    text-align:center;
    font-size:12px;
    color:var(--gray-dark);
    cursor:pointer;
  }
  .file-input-row:hover{border-color:var(--black);}
  .file-input-row.has-image{border-style:solid;padding:0;overflow:hidden;}
  .file-input-row.has-image img{width:100%;max-height:180px;object-fit:cover;display:block;}

  @media (max-width:640px){
    .container{padding:24px 18px 80px;}
    .topbar{padding:16px 18px;}
    .detail-head{flex-direction:column;}
  }

  /* ---------- Login gate ---------- */
  #loginGate{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .login-card{
    width:100%;
    max-width:340px;
    border:1px solid var(--line);
    padding:36px 32px;
  }
  .login-brand{
    font-size:14px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    margin-bottom:28px;
    text-align:center;
  }
  .login-card label{
    display:block;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--gray-dark);
    margin-bottom:6px;
    margin-top:16px;
  }
  .login-card label:first-of-type{margin-top:0;}
  .login-card input{
    width:100%;
    padding:10px 12px;
    font-size:13px;
  }
  .login-card .btn{width:100%;margin-top:24px;}
  .login-error{
    font-size:12px;
    color:#b00020;
    margin-top:14px;
    display:none;
  }
  .login-error.active{display:block;}
  #appRoot{display:none;}
</style>
</head>
<body>

<!-- LOGIN GATE -->
<div id="loginGate">
  <div class="login-card">
    <div class="login-brand">Walker Wolfe Developments</div>
    <label>Email</label>
    <input type="email" id="loginEmail" autocomplete="username">
    <label>Password</label>
    <input type="password" id="loginPassword" autocomplete="current-password">
    <button class="btn" id="loginBtn">Sign in</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div id="appRoot">

<div class="topbar">
  <div class="brand">Walker Wolfe Developments</div>
  <div class="topbar-actions">
    <span class="save-indicator" id="saveIndicator"></span>
    <button class="btn-text" id="homeLink" style="display:none;">All projects</button>
    <button class="btn-text" id="logoutBtn">Sign out</button>
  </div>
</div>

<!-- HOME VIEW -->
<div class="view active" id="homeView">
  <div class="container">
    <div class="page-head">
      <div>
        <div class="page-title">Projects</div>
        <div class="page-sub" id="homeSub">0 in development</div>
      </div>
      <div class="head-actions">
        <button class="btn-text" id="manageCatBtn">Manage categories</button>
      </div>
    </div>
    <div id="homeContent"></div>
  </div>
</div>

<!-- DETAIL VIEW -->
<div class="view" id="detailView">
  <div class="container">
    <button class="btn-text" id="backBtn" style="margin-bottom:24px;">← All projects</button>

    <div class="detail-head">
      <div class="detail-img" id="detailImgWrap">
        <div class="placeholder" id="detailImgPlaceholder">No image</div>
        <img id="detailImg" style="display:none;">
        <div class="img-overlay">Change image</div>
        <input type="file" id="detailImgInput" accept="image/*" style="display:none;">
      </div>
      <div class="detail-info">
        <input class="detail-name" id="detailName" type="text" placeholder="Project name">
        <div class="stage-row" id="stageRow"></div>
        <span class="cat-tag">Category</span>
        <div class="cat-pill-row" id="catPillRow"></div>
        <div class="detail-actions">
          <button class="btn-text" id="deleteProductBtn" style="color:var(--gray);">Delete project</button>
        </div>
      </div>
    </div>

    <section class="block">
      <div class="block-head">
        <div class="block-title">To-do</div>
        <div class="block-count" id="todoCount"></div>
      </div>
      <div class="todo-add">
        <input type="text" id="todoInput" placeholder="Add a task and press Enter">
        <button class="btn btn-outline" id="todoAddBtn">Add</button>
      </div>
      <div class="todo-list" id="todoList"></div>
    </section>

    <section class="block">
      <div class="block-head">
        <div class="block-title">Files</div>
        <div class="block-count" id="fileCount"></div>
      </div>
      <div class="files-grid" id="filesGrid"></div>
      <input type="file" id="fileInput" accept="image/*" multiple style="display:none;">
    </section>

    <section class="block">
      <div class="block-head">
        <div class="block-title">Timeline</div>
        <div class="block-count" id="timelineCount"></div>
      </div>
      <div class="timeline-wrap">
        <div class="timeline" id="timeline"></div>
      </div>
    </section>
  </div>
</div>

</div><!-- /appRoot -->

<!-- MODAL: New project -->
<div class="modal-overlay" id="newProductModal">
  <div class="modal">
    <h3>New project</h3>
    <label>Name</label>
    <input type="text" id="newProductName" placeholder="e.g. Ceramic pour-over set">
    <label>Image (optional)</label>
    <div class="file-input-row" id="newProductImgRow">Click to upload an image</div>
    <input type="file" id="newProductImgInput" accept="image/*" style="display:none;">
    <label>Category</label>
    <select id="newProductCategory" style="width:100%;padding:10px 12px;font-size:13px;"></select>
    <div class="modal-actions">
      <button class="btn-text" id="cancelNewProduct">Cancel</button>
      <button class="btn" id="confirmNewProduct">Create</button>
    </div>
  </div>
</div>

<!-- MODAL: Timeline node -->
<div class="modal-overlay" id="timelineModal">
  <div class="modal">
    <h3 id="timelineModalTitle">New timeline entry</h3>
    <label>Date</label>
    <input type="date" id="timelineDate">
    <label>Note</label>
    <textarea id="timelineText" placeholder="What happened?"></textarea>
    <div class="modal-actions">
      <button class="btn-text" id="deleteTimelineBtn" style="color:var(--gray); margin-right:auto;">Delete</button>
      <button class="btn-text" id="cancelTimeline">Cancel</button>
      <button class="btn" id="confirmTimeline">Save</button>
    </div>
  </div>
</div>

<!-- MODAL: Manage categories -->
<div class="modal-overlay" id="manageCatModal">
  <div class="modal">
    <h3>Categories</h3>
    <div class="manage-cat-list" id="manageCatList"></div>
    <label style="margin-top:0;">New category</label>
    <div class="manage-cat-add">
      <input type="text" id="manageCatNewInput" placeholder="e.g. Kitchenware">
      <button class="btn btn-outline" id="manageCatAddBtn">Add</button>
    </div>
    <div class="modal-actions">
      <button class="btn" id="closeManageCatBtn">Done</button>
    </div>
  </div>
</div>

<script>

  var firebaseConfig = {

  };
  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth();

<script>
(function(){
  "use strict";

  var STAGES = ["Concept","Design","Sampling","Production","Launched"];

  var state = { products: [], categories: [] };
  var currentProductId = null;
  var pendingNewProductImage = null;
  var editingTimelineNodeId = null;

  function ensureState(){
    if(!state.categories) state.categories = [];
    if(!state.products) state.products = [];
  }
  function catName(id){
    var c = state.categories.find(function(c){ return c.id===id; });
    return c ? c.name : null;
  }

  // ---------- Storage (Firestore, scoped to signed-in user) ----------
  var unsubscribeSnapshot = null;
  var lastSyncedJson = null;
  var saveTimer = null;

  function scheduleSave(){
    var ind = document.getElementById("saveIndicator");
    ind.textContent = "Saving…";
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 400);
  }
  function save(){
    var ind = document.getElementById("saveIndicator");
    var user = auth.currentUser;
    if(!user) return;
    var json = JSON.stringify(state);
    lastSyncedJson = json;
    db.collection("appdata").doc(user.uid).set({ data: json }, { merge: true })
      .then(function(){
        ind.textContent = "Saved";
        setTimeout(function(){ if(ind.textContent==="Saved") ind.textContent=""; }, 1500);
      })
      .catch(function(e){
        ind.textContent = "Save failed";
        console.error("Firestore save error:", e);
      });
  }

  function subscribeToData(uid){
    if(unsubscribeSnapshot) unsubscribeSnapshot();
    unsubscribeSnapshot = db.collection("appdata").doc(uid)
      .onSnapshot(function(docSnap){
        var json = docSnap.exists ? docSnap.data().data : null;
        if(json === lastSyncedJson) return; // echo of our own write — ignore
        lastSyncedJson = json;
        if(json){
          try{ state = JSON.parse(json); }catch(e){ state = { products: [], categories: [] }; }
        } else {
          state = { products: [], categories: [] };
        }
        ensureState();
        if(currentProductId && getProduct()){
          renderDetail();
        } else {
          showHome();
        }
      }, function(e){
        console.error("Firestore listen error:", e);
        document.getElementById("saveIndicator").textContent = "Sync error";
      });
  }

  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  }

  // Resize/compress an uploaded image so stored documents stay well under
  // Firestore's 1MB-per-document limit. Longest side capped at maxDim.
  function fileToCompressedDataURL(file, maxDim, quality, cb){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        var scale = Math.min(1, maxDim / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * scale));
        var ch = Math.max(1, Math.round(h * scale));
        var canvas = document.createElement("canvas");
        canvas.width = cw; canvas.height = ch;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, cw, ch);
        cb(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = function(){ cb(null); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ cb(null); };
    reader.readAsDataURL(file);
  }
  function fmtDate(d){
    if(!d) return "";
    var parts = d.split("-");
    if(parts.length!==3) return d;
    var months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return months[parseInt(parts[1],10)-1] + " " + parseInt(parts[2],10) + ", " + parts[0];
  }
  function progressForStage(stage){
    var idx = STAGES.indexOf(stage);
    if(idx<0) return 0;
    return Math.round(((idx+1)/STAGES.length)*100);
  }

  // ---------- Navigation ----------
  function showHome(){
    currentProductId = null;
    document.getElementById("homeView").classList.add("active");
    document.getElementById("detailView").classList.remove("active");
    document.getElementById("homeLink").style.display = "none";
    renderHome();
  }
  function showDetail(id){
    currentProductId = id;
    document.getElementById("homeView").classList.remove("active");
    document.getElementById("detailView").classList.add("active");
    document.getElementById("homeLink").style.display = "inline-block";
    renderDetail();
  }

  // ---------- Home render ----------
  function tileHtml(p){
    var prog = progressForStage(p.stage);
    return '<button class="tile" data-id="'+p.id+'">' +
      '<div class="tile-img">' +
        (p.image ? '<img src="'+p.image+'" alt="">' : '<span class="placeholder">No image</span>') +
      '</div>' +
      '<div class="tile-body">' +
        '<div class="tile-name">'+escapeHtml(p.name||"Untitled")+'</div>' +
        '<div class="tile-meta">' +
          '<span class="stage-badge">'+escapeHtml(p.stage||STAGES[0])+'</span>' +
          '<span style="font-size:11px;color:var(--gray);">'+prog+'%</span>' +
        '</div>' +
        '<div class="progress-track"><div class="progress-fill" style="width:'+prog+'%;"></div></div>' +
      '</div>' +
    '</button>';
  }

  function addTileHtml(id){
    return '<button class="add-tile" id="'+id+'"><span class="plus">+</span><span>New project</span></button>';
  }

  function wireGrid(container){
    container.querySelectorAll(".tile").forEach(function(t){
      t.addEventListener("click", function(){ showDetail(t.getAttribute("data-id")); });
    });
    container.querySelectorAll(".add-tile").forEach(function(t){
      t.addEventListener("click", openNewProductModal);
    });
  }

  function renderHome(){
    var content = document.getElementById("homeContent");
    var sub = document.getElementById("homeSub");
    sub.textContent = state.products.length + " in development";

    if(state.products.length===0 && state.categories.length===0){
      content.innerHTML = '<div class="grid">' + addTileHtml("emptyAddTile") + '</div>';
      wireGrid(content);
      return;
    }

    var html = "";

    state.categories.forEach(function(cat){
      var items = state.products.filter(function(p){ return p.categoryId===cat.id; });
      html += '<div class="category-section">' +
        '<div class="category-header"><h2>'+escapeHtml(cat.name)+'</h2><span class="cat-count">'+items.length+'</span></div>';
      if(items.length===0){
        html += '<div class="category-empty-row">No projects in this category yet.</div>';
      } else {
        html += '<div class="grid">' + items.map(tileHtml).join("") + '</div>';
      }
      html += '</div>';
    });

    var uncategorized = state.products.filter(function(p){ return !p.categoryId || !catName(p.categoryId); });
    html += '<div class="category-section">' +
      '<div class="category-header"><h2>Uncategorized</h2><span class="cat-count">'+uncategorized.length+'</span></div>' +
      '<div class="grid">' + uncategorized.map(tileHtml).join("") + addTileHtml("gridAddTile") + '</div>' +
    '</div>';

    content.innerHTML = html;
    wireGrid(content);
  }

  function escapeHtml(s){
    var d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  // ---------- New product modal ----------
  function openNewProductModal(){
    document.getElementById("newProductName").value = "";
    document.getElementById("newProductImgRow").innerHTML = "Click to upload an image";
    document.getElementById("newProductImgRow").classList.remove("has-image");
    pendingNewProductImage = null;
    var sel = document.getElementById("newProductCategory");
    sel.innerHTML = '<option value="">Uncategorized</option>' +
      state.categories.map(function(c){ return '<option value="'+c.id+'">'+escapeHtml(c.name)+'</option>'; }).join("");
    document.getElementById("newProductModal").classList.add("active");
    document.getElementById("newProductName").focus();
  }
  function closeNewProductModal(){
    document.getElementById("newProductModal").classList.remove("active");
  }

  document.getElementById("newProductImgRow").addEventListener("click", function(){
    document.getElementById("newProductImgInput").click();
  });
  document.getElementById("newProductImgInput").addEventListener("change", function(e){
    var file = e.target.files[0];
    if(!file) return;
    fileToCompressedDataURL(file, 900, 0.82, function(dataUrl){
      if(!dataUrl) return;
      pendingNewProductImage = dataUrl;
      var row = document.getElementById("newProductImgRow");
      row.classList.add("has-image");
      row.innerHTML = '<img src="'+dataUrl+'">';
    });
  });
  document.getElementById("cancelNewProduct").addEventListener("click", closeNewProductModal);
  document.getElementById("newProductModal").addEventListener("click", function(e){
    if(e.target === this) closeNewProductModal();
  });
  document.getElementById("confirmNewProduct").addEventListener("click", function(){
    var name = document.getElementById("newProductName").value.trim();
    if(!name){ document.getElementById("newProductName").focus(); return; }
    var catId = document.getElementById("newProductCategory").value || null;
    var p = {
      id: uid(),
      name: name,
      image: pendingNewProductImage,
      stage: STAGES[0],
      categoryId: catId,
      todos: [],
      files: [],
      timeline: []
    };
    state.products.unshift(p);
    closeNewProductModal();
    scheduleSave();
    renderHome();
    showDetail(p.id);
  });
  document.getElementById("newProductName").addEventListener("keydown", function(e){
    if(e.key==="Enter") document.getElementById("confirmNewProduct").click();
  });

  // ---------- Detail render ----------
  function getProduct(){
    return state.products.find(function(p){ return p.id===currentProductId; });
  }

  function renderDetail(){
    var p = getProduct();
    if(!p){ showHome(); return; }

    // image
    var img = document.getElementById("detailImg");
    var ph = document.getElementById("detailImgPlaceholder");
    if(p.image){ img.src = p.image; img.style.display="block"; ph.style.display="none"; }
    else{ img.style.display="none"; ph.style.display="flex"; }

    // name
    document.getElementById("detailName").value = p.name || "";

    // stage pills
    var stageRow = document.getElementById("stageRow");
    stageRow.innerHTML = "";
    STAGES.forEach(function(s){
      var pill = document.createElement("button");
      pill.className = "stage-pill" + (p.stage===s ? " active":"");
      pill.textContent = s;
      pill.addEventListener("click", function(){
        p.stage = s;
        scheduleSave();
        renderDetail();
      });
      stageRow.appendChild(pill);
    });

    renderCatPills(p);
    renderTodos(p);
    renderFiles(p);
    renderTimeline(p);
  }

  function renderCatPills(p){
    var row = document.getElementById("catPillRow");
    row.innerHTML = "";
    var none = document.createElement("button");
    none.className = "cat-pill" + (!p.categoryId ? " active" : "");
    none.textContent = "None";
    none.addEventListener("click", function(){ p.categoryId = null; scheduleSave(); renderCatPills(p); });
    row.appendChild(none);

    state.categories.forEach(function(c){
      var pill = document.createElement("button");
      pill.className = "cat-pill" + (p.categoryId===c.id ? " active" : "");
      pill.textContent = c.name;
      pill.addEventListener("click", function(){ p.categoryId = c.id; scheduleSave(); renderCatPills(p); });
      row.appendChild(pill);
    });

    var add = document.createElement("button");
    add.className = "cat-pill add-cat-pill";
    add.textContent = "+ New";
    add.addEventListener("click", function(){ openManageCatModal(); });
    row.appendChild(add);
  }

  document.getElementById("detailName").addEventListener("input", function(){
    var p = getProduct();
    if(!p) return;
    p.name = this.value;
    scheduleSave();
  });
  document.getElementById("backBtn").addEventListener("click", showHome);
  document.getElementById("homeLink").addEventListener("click", showHome);

  document.getElementById("detailImgWrap").addEventListener("click", function(){
    document.getElementById("detailImgInput").click();
  });
  document.getElementById("detailImgInput").addEventListener("change", function(e){
    var file = e.target.files[0];
    if(!file) return;
    var p = getProduct();
    fileToCompressedDataURL(file, 900, 0.82, function(dataUrl){
      if(!dataUrl) return;
      p.image = dataUrl;
      scheduleSave();
      renderDetail();
      renderHome();
    });
  });

  document.getElementById("deleteProductBtn").addEventListener("click", function(){
    var p = getProduct();
    if(!p) return;
    if(!confirm('Delete "'+p.name+'"? This removes its to-dos, files, and timeline.')) return;
    state.products = state.products.filter(function(x){ return x.id!==p.id; });
    scheduleSave();
    showHome();
  });

  // ---------- To-do ----------
  function renderTodos(p){
    var list = document.getElementById("todoList");
    var count = document.getElementById("todoCount");
    var open = p.todos.filter(function(t){ return !t.done; }).length;
    count.textContent = p.todos.length ? (open + " open") : "";
    if(p.todos.length===0){
      list.innerHTML = '<div class="block-empty">No tasks yet.</div>';
      return;
    }
    list.innerHTML = "";
    p.todos.forEach(function(t){
      var row = document.createElement("div");
      row.className = "todo-item";
      row.innerHTML =
        '<div class="todo-check'+(t.done?' checked':'')+'">'+(t.done?'✓':'')+'</div>' +
        '<div class="todo-text'+(t.done?' done':'')+'">'+escapeHtml(t.text)+'</div>' +
        '<button class="todo-del">Remove</button>';
      row.querySelector(".todo-check").addEventListener("click", function(){
        t.done = !t.done;
        scheduleSave();
        renderTodos(p);
      });
      row.querySelector(".todo-del").addEventListener("click", function(){
        p.todos = p.todos.filter(function(x){ return x.id!==t.id; });
        scheduleSave();
        renderTodos(p);
      });
      list.appendChild(row);
    });
  }
  function addTodo(){
    var input = document.getElementById("todoInput");
    var text = input.value.trim();
    if(!text) return;
    var p = getProduct();
    p.todos.push({id: uid(), text: text, done:false});
    input.value = "";
    scheduleSave();
    renderTodos(p);
  }
  document.getElementById("todoAddBtn").addEventListener("click", addTodo);
  document.getElementById("todoInput").addEventListener("keydown", function(e){
    if(e.key==="Enter") addTodo();
  });

  // ---------- Files ----------
  function renderFiles(p){
    var grid = document.getElementById("filesGrid");
    var count = document.getElementById("fileCount");
    count.textContent = p.files.length ? p.files.length + (p.files.length===1?" file":" files") : "";
    grid.innerHTML = "";
    p.files.forEach(function(f){
      var card = document.createElement("div");
      card.className = "file-card";
      card.innerHTML =
        '<button class="file-del">×</button>' +
        '<div class="file-thumb">' + (f.image ? '<img src="'+f.image+'">' : '<span class="file-icon">＋</span>') + '</div>' +
        '<div class="file-name">'+escapeHtml(f.name)+'</div>';
      card.querySelector(".file-del").addEventListener("click", function(ev){
        ev.stopPropagation();
        p.files = p.files.filter(function(x){ return x.id!==f.id; });
        scheduleSave();
        renderFiles(p);
      });
      grid.appendChild(card);
    });
    var addCard = document.createElement("button");
    addCard.className = "add-file-card";
    addCard.innerHTML = '<span class="plus">+</span><span>Add file</span>';
    addCard.addEventListener("click", function(){
      document.getElementById("fileInput").click();
    });
    grid.appendChild(addCard);
  }
  document.getElementById("fileInput").addEventListener("change", function(e){
    var p = getProduct();
    var files = Array.from(e.target.files || []);
    var remaining = files.length;
    if(remaining===0) return;
    files.forEach(function(file){
      fileToCompressedDataURL(file, 700, 0.8, function(dataUrl){
        if(dataUrl){
          p.files.push({id: uid(), name: file.name, image: dataUrl});
        }
        remaining--;
        if(remaining===0){
          scheduleSave();
          renderFiles(p);
        }
      });
    });
    e.target.value = "";
  });

  // ---------- Timeline ----------
  function renderTimeline(p){
    var wrap = document.getElementById("timeline");
    var count = document.getElementById("timelineCount");
    var sorted = p.timeline.slice().sort(function(a,b){
      return (a.date||"").localeCompare(b.date||"");
    });
    count.textContent = sorted.length ? sorted.length + (sorted.length===1?" entry":" entries") : "";

    if(sorted.length===0){
      wrap.innerHTML = '';
      var emptyWrap = document.createElement("div");
      emptyWrap.className = "timeline-empty";
      var addBtn = document.createElement("button");
      addBtn.className = "t-add-btn";
      addBtn.textContent = "+";
      addBtn.title = "Add timeline entry";
      addBtn.addEventListener("click", function(){ openTimelineModal(null); });
      emptyWrap.appendChild(addBtn);
      var label = document.createElement("span");
      label.textContent = "No entries yet — add the first milestone.";
      emptyWrap.appendChild(label);
      wrap.appendChild(emptyWrap);
      return;
    }

    wrap.innerHTML = "";

    var leadBtn = document.createElement("button");
    leadBtn.className = "t-add-btn";
    leadBtn.textContent = "+";
    leadBtn.title = "Add entry";
    leadBtn.addEventListener("click", function(){ openTimelineModal(null); });
    wrap.appendChild(leadBtn);

    sorted.forEach(function(node, i){
      var connector = document.createElement("div");
      connector.className = "t-connector";
      wrap.appendChild(connector);

      var el = document.createElement("div");
      el.className = "t-node";
      el.innerHTML =
        '<div class="t-dot"></div>' +
        '<div class="t-date">'+(node.date ? fmtDate(node.date) : "No date")+'</div>' +
        '<div class="t-text">'+escapeHtml(node.text||"")+'</div>';
      el.addEventListener("click", function(){ openTimelineModal(node.id); });
      wrap.appendChild(el);
    });

    var trailBtn = document.createElement("button");
    trailBtn.className = "t-add-btn";
    trailBtn.textContent = "+";
    trailBtn.title = "Add entry";
    trailBtn.addEventListener("click", function(){ openTimelineModal(null); });
    var connector2 = document.createElement("div");
    connector2.className = "t-connector";
    wrap.appendChild(connector2);
    wrap.appendChild(trailBtn);

    // scroll to end so latest entries are visible
    wrap.scrollLeft = wrap.scrollWidth;
  }

  function openTimelineModal(nodeId){
    editingTimelineNodeId = nodeId;
    var title = document.getElementById("timelineModalTitle");
    var dateInput = document.getElementById("timelineDate");
    var textInput = document.getElementById("timelineText");
    var delBtn = document.getElementById("deleteTimelineBtn");

    if(nodeId){
      var p = getProduct();
      var node = p.timeline.find(function(n){ return n.id===nodeId; });
      title.textContent = "Edit entry";
      dateInput.value = node.date || "";
      textInput.value = node.text || "";
      delBtn.style.display = "inline-block";
    } else {
      title.textContent = "New timeline entry";
      dateInput.value = new Date().toISOString().slice(0,10);
      textInput.value = "";
      delBtn.style.display = "none";
    }
    document.getElementById("timelineModal").classList.add("active");
    textInput.focus();
  }
  function closeTimelineModal(){
    document.getElementById("timelineModal").classList.remove("active");
    editingTimelineNodeId = null;
  }
  document.getElementById("cancelTimeline").addEventListener("click", closeTimelineModal);
  document.getElementById("timelineModal").addEventListener("click", function(e){
    if(e.target === this) closeTimelineModal();
  });
  document.getElementById("confirmTimeline").addEventListener("click", function(){
    var p = getProduct();
    var date = document.getElementById("timelineDate").value;
    var text = document.getElementById("timelineText").value.trim();
    if(!text){ document.getElementById("timelineText").focus(); return; }
    if(editingTimelineNodeId){
      var node = p.timeline.find(function(n){ return n.id===editingTimelineNodeId; });
      node.date = date; node.text = text;
    } else {
      p.timeline.push({id: uid(), date: date, text: text});
    }
    closeTimelineModal();
    scheduleSave();
    renderTimeline(p);
  });
  document.getElementById("deleteTimelineBtn").addEventListener("click", function(){
    var p = getProduct();
    p.timeline = p.timeline.filter(function(n){ return n.id!==editingTimelineNodeId; });
    closeTimelineModal();
    scheduleSave();
    renderTimeline(p);
  });

  // ---------- Manage categories ----------
  function openManageCatModal(){
    document.getElementById("manageCatNewInput").value = "";
    renderManageCatList();
    document.getElementById("manageCatModal").classList.add("active");
  }
  function closeManageCatModal(){
    document.getElementById("manageCatModal").classList.remove("active");
    renderHome();
    if(currentProductId) renderCatPills(getProduct());
  }
  function renderManageCatList(){
    var list = document.getElementById("manageCatList");
    list.innerHTML = "";
    if(state.categories.length===0){
      list.innerHTML = '<div class="block-empty" style="padding:0;">No categories yet.</div>';
      return;
    }
    state.categories.forEach(function(c){
      var row = document.createElement("div");
      row.className = "manage-cat-row";
      var input = document.createElement("input");
      input.type = "text";
      input.value = c.name;
      input.addEventListener("change", function(){
        var v = input.value.trim();
        if(v){ c.name = v; scheduleSave(); renderHome(); }
        else{ input.value = c.name; }
      });
      var del = document.createElement("button");
      del.textContent = "Delete";
      del.addEventListener("click", function(){
        state.products.forEach(function(p){ if(p.categoryId===c.id) p.categoryId = null; });
        state.categories = state.categories.filter(function(x){ return x.id!==c.id; });
        scheduleSave();
        renderManageCatList();
      });
      row.appendChild(input);
      row.appendChild(del);
      list.appendChild(row);
    });
  }
  function addCategory(){
    var input = document.getElementById("manageCatNewInput");
    var name = input.value.trim();
    if(!name) return;
    state.categories.push({id: uid(), name: name});
    input.value = "";
    scheduleSave();
    renderManageCatList();
  }
  document.getElementById("manageCatBtn").addEventListener("click", openManageCatModal);
  document.getElementById("manageCatAddBtn").addEventListener("click", addCategory);
  document.getElementById("manageCatNewInput").addEventListener("keydown", function(e){
    if(e.key==="Enter") addCategory();
  });
  document.getElementById("closeManageCatBtn").addEventListener("click", closeManageCatModal);
  document.getElementById("manageCatModal").addEventListener("click", function(e){
    if(e.target === this) closeManageCatModal();
  });

  // ---------- Auth ----------
  function showLoginGate(){
    document.getElementById("loginGate").style.display = "flex";
    document.getElementById("appRoot").style.display = "none";
  }
  function showApp(){
    document.getElementById("loginGate").style.display = "none";
    document.getElementById("appRoot").style.display = "block";
  }
  function setLoginError(msg){
    var el = document.getElementById("loginError");
    if(msg){ el.textContent = msg; el.classList.add("active"); }
    else{ el.textContent = ""; el.classList.remove("active"); }
  }
  function attemptSignIn(){
    var email = document.getElementById("loginEmail").value.trim();
    var password = document.getElementById("loginPassword").value;
    setLoginError("");
    if(!email || !password){ setLoginError("Enter your email and password."); return; }
    var btn = document.getElementById("loginBtn");
    btn.disabled = true;
    auth.signInWithEmailAndPassword(email, password)
      .catch(function(err){
        setLoginError(err.message || "Sign-in failed.");
      })
      .finally(function(){ btn.disabled = false; });
  }
  document.getElementById("loginBtn").addEventListener("click", attemptSignIn);
  document.getElementById("loginPassword").addEventListener("keydown", function(e){
    if(e.key==="Enter") attemptSignIn();
  });
  document.getElementById("logoutBtn").addEventListener("click", function(){
    auth.signOut();
  });

  auth.onAuthStateChanged(function(user){
    if(user){
      showApp();
      document.getElementById("loginEmail").value = "";
      document.getElementById("loginPassword").value = "";
      setLoginError("");
      lastSyncedJson = null;
      subscribeToData(user.uid);
    } else {
      if(unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot = null; }
      state = { products: [], categories: [] };
      currentProductId = null;
      showLoginGate();
    }
  });

  // ---------- Init ----------
  ensureState();
})();
</script>
</body>
</html>
